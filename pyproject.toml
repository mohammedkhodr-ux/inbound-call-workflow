[project]
name = "dda-inbound-call-workflow"
version = "0.1.0"
description = "Digital Dubai Authority inbound call workflow: Genesys routing to Mistral voice AI with UAEPASS auth, ServiceNow ticketing, and email/SMS follow-up."
requires-python = ">=3.12"
dependencies = [
    "mistralai>=2.8.0",
    "mistralai-workflows[mistralai]>=0.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["PLR0402"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
