[project]
name = "inbound-call-workflow"
version = "0.1.0"
description = "Digital Dubai Authority inbound call center workflow: Genesys -> Mistral voice AI -> UAEPASS auth -> ServiceNow ticket resolution -> email/SMS close-out."
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.15.0,<4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflows", "src/entrypoints", "src/integrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
